function saveData(){
    localStorage.setItem("triviaScoresTema9", JSON.stringify(scores));
    localStorage.setItem("triviaUsedTema9", JSON.stringify(used));
}

function refreshScores(){
    for(let i=0;i<5;i++){
        document.getElementById("s"+i).innerText = scores[i];
    }
}

function refreshCounter(){
    document.getElementById("counter").innerText = "Preguntes disponibles: " + (questions.length - used.length) + " / " + questions.length;
}

function newQuestion(){
    if(used.length >= questions.length){
        document.getElementById("question").innerText = "Ja han eixit totes les preguntes. Prem Reiniciar preguntes.";
        document.getElementById("answer").style.display="none";
        refreshCounter();
        return;
    }
    let index;
    do{
        index = Math.floor(Math.random()*questions.length);
    }while(used.includes(index));
    used.push(index);
    let q = questions[index];
    document.getElementById("question").innerText = q[0];
    document.getElementById("answer").innerText = q[1];
    document.getElementById("answer").style.display="none";
    saveData();
    refreshCounter();
}

function showAnswer(){
    document.getElementById("answer").style.display="block";
}

function addPoints(team, pts){
    scores[team]+=pts;
    refreshScores();
    saveData();
}

function resetScores(){
    scores = [0,0,0,0,0];
    refreshScores();
    saveData();
}

function resetUsed(){
    used = [];
    document.getElementById("question").innerText = "Preguntes reiniciades. Prem Nova pregunta.";
    document.getElementById("answer").style.display="none";
    refreshCounter();
    saveData();
}

refreshScores();
refreshCounter();
</script>
