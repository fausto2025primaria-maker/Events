<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Trivial Medieval</title>
<style>
body{
    font-family: Georgia, serif;
    background:#f4ecd8;
    text-align:center;
    margin:0;
}
h1{background:#5b3a1a;color:white;padding:10px;}
.container{padding:20px;}
.question{
    font-size:24px;
    margin:20px;
    min-height:80px;
}
.answer{
    display:none;
    font-size:20px;
    color:#2c5f2d;
    margin:10px;
}
button{
    padding:10px 20px;
    margin:5px;
    font-size:16px;
    cursor:pointer;
}
.scoreboard{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}
.team{
    background:white;
    padding:10px;
    border:2px solid #5b3a1a;
    width:120px;
}
</style>
</head>
<body>

<h1>🏰 Trivial Medieval</h1>

<div class="container">

<div class="question" id="question">Prem "Nova pregunta"</div>
<div class="answer" id="answer"></div>

<button onclick="newQuestion()">Nova pregunta</button>
<button onclick="showAnswer()">Mostrar resposta</button>

<div>
<button onclick="addPoints(0,5)">Equip 1 +5</button>
<button onclick="addPoints(1,5)">Equip 2 +5</button>
<button onclick="addPoints(2,5)">Equip 3 +5</button>
<button onclick="addPoints(3,5)">Equip 4 +5</button>
<button onclick="addPoints(4,5)">Equip 5 +5</button>
</div>

<div class="scoreboard">
<div class="team">Regne 1<br><span id="s0">0</span></div>
<div class="team">Regne 2<br><span id="s1">0</span></div>
<div class="team">Regne 3<br><span id="s2">0</span></div>
<div class="team">Regne 4<br><span id="s3">0</span></div>
<div class="team">Regne 5<br><span id="s4">0</span></div>
</div>

</div>

<script>

let scores = [0,0,0,0,0];

const questions = [
["En quina època se situa l’Edat Mitjana?","Entre la caiguda de Roma i 1492"],
["Quin any cau Roma?","476"],
["Qui eren els visigots?","Un poble germànic"],
["Capital visigoda?","Toledo"],
["Religió dels visigots en 589?","Cristianisme"],
["Qui conquereix en 711?","Musulmans"],
["Territori musulmà?","Al-Àndalus"],
["Primer regne cristià?","Astúries"],
["Qui era Almanzor?","Líder musulmà"],
["Què és la Reconquesta?","Recuperació cristiana"],
["Corona d’Aragó any?","1137"],
["Què eren les croades?","Guerres religioses"],
["Casament Reis Catòlics?","1469"],
["Fi Edat Mitjana?","1492"],
["Colom any?","1492"],
["Qui treballava la terra?","Camperols"],
["On vivien nobles?","Castells"],
["Qui copiava llibres?","Monjos"],
["Què és monestir?","Lloc religiós"],
["Menjar camperols?","Pa i verdures"],
["Què és gremi?","Associació artesans"],
["Qui feia el pa?","Forner"],
["Qui feia ferramentes?","Ferrer"],
["Què és mercat?","Compra-venda"],
["Què és ciutat medieval?","Amb muralles"],
["Qui protegia regne?","Cavallers"],
["Què portaven cavallers?","Armadura"],
["Què és castell?","Fortalesa"],
["Muralles per a què?","Defensar"],
["Què és ariet?","Arma"],
["Qui atacava camins?","Bandolers"],
["Què és setge?","Rodejar castell"],
["Animal cavallers?","Cavall"],
["Què és espasa?","Arma"],
["Qui comandava?","Rei"],
["Què és comerç?","Intercanvi"],
["Dinero medieval?","Monedes"],
["Què és impost?","Pagament"],
["Qui pagava impostos?","Camperols"],
["Què és troc?","Intercanvi sense diners"],
["Què produeix granja?","Menjar"],
["Ruta comercial?","Camí comerç"],
["Què passa en fira?","Comerç gran"],
["Què és població?","Persones"],
["Sense menjar?","Fam"],
["Qui copiava llibres?","Monjos"],
["Com es diuen llibres a mà?","Manuscrits"],
["Què és catedral?","Església gran"],
["Universitat medieval?","Centre estudis"],
["Invent final?","Impremta"]
];

function newQuestion(){
    let q = questions[Math.floor(Math.random()*questions.length)];
    document.getElementById("question").innerText = q[0];
    document.getElementById("answer").innerText = q[1];
    document.getElementById("answer").style.display="none";
}

function showAnswer(){
    document.getElementById("answer").style.display="block";
}

function addPoints(team, pts){
    scores[team]+=pts;
    document.getElementById("s"+team).innerText = scores[team];
}

</script>

</body>
</html>
